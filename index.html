<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1768d2"><meta name="description" content="PulseAlert: clear health information and practical prevention tips."><link rel="manifest" href="manifest.webmanifest"><title>PulseAlert</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#173047;background:#f5f9fc}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #f9c74f;outline-offset:2px}.app{max-width:520px;margin:auto;min-height:100vh;background:#f5f9fc;padding-bottom:96px}.top{background:linear-gradient(150deg,#1768d2,#0b4ca4);color:white;padding:26px 22px 30px;border-radius:0 0 28px 28px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}.mark{display:grid;place-items:center;width:38px;height:38px;background:white;color:#1768d2;border-radius:12px;font-size:22px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.82}.top h1{font-size:29px;line-height:1.15;margin:28px 0 8px}.top p{opacity:.9;line-height:1.5;margin:0}.main{padding:20px}.panel{background:white;border:1px solid #e4edf3;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 6px 22px #183c6110}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.section h2{font-size:19px;margin:0}.pill{display:inline-flex;align-items:center;background:#eaf6ef;color:#18754b;border-radius:100px;padding:5px 10px;font-size:11px;font-weight:750}.muted{color:#637789;font-size:13px;line-height:1.5}.card-title{font-size:18px;font-weight:750;margin:10px 0 8px}.card-copy{line-height:1.5;margin:0 0 15px}.tag{font-size:12px;color:#1768d2;font-weight:750}.actions{display:flex;gap:10px;align-items:center}.primary{background:#1768d2;color:#fff;border:0;border-radius:11px;padding:11px 15px;font-weight:700}.secondary{background:#eff5fc;color:#1768d2;border:0;border-radius:11px;padding:11px 15px;font-weight:700}.save{margin-left:auto;background:transparent;border:0;color:#1768d2;font-weight:700}.callout{background:#fff8e5;border:1px solid #f8dea0;border-radius:16px;padding:15px;color:#6d511b;line-height:1.45;font-size:13px}.search{width:100%;padding:14px;border:1px solid #d8e5ee;border-radius:13px;background:white;margin:4px 0 15px}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.filter{border:1px solid #d6e5ef;border-radius:100px;background:white;color:#436075;padding:9px 13px;white-space:nowrap}.filter.active{background:#1768d2;color:white;border-color:#1768d2}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:white;border-top:1px solid #dfebf2;display:flex;justify-content:space-around;padding:10px 3px max(12px,env(safe-area-inset-bottom));box-shadow:0 -4px 18px #183c6114}.nav button{background:none;border:0;color:#657b8c;display:grid;gap:3px;place-items:center;font-size:11px;min-width:65px}.nav button.active{color:#1768d2;font-weight:800}.nav span{font-size:21px}.detail{position:fixed;inset:0;background:#f5f9fc;z-index:3;overflow:auto;max-width:520px;margin:auto;padding:20px 20px 40px}.detail h1{font-size:27px}.detail p,.detail li{line-height:1.65}.detail h3{margin-top:25px}.back{border:0;background:white;color:#1768d2;padding:10px 14px;border-radius:11px}.source{font-size:13px;word-break:break-word}.source a{color:#1768d2}.empty{text-align:center;padding:30px;color:#637789}.setting{display:flex;justify-content:space-between;align-items:center;gap:15px}.setting select{border:1px solid #d6e5ef;border-radius:10px;padding:8px;background:white}.hide{display:none}
</style></head><body><div id="app" class="app"></div><script>
const articles=[
{id:'malaria',category:'Prevention',title:'Protect yourself from malaria',summary:'Small steps can help reduce mosquito bites.',body:['Sleep under an insecticide-treated mosquito net in places where malaria is present.','If you have a fever or feel unwell, seek assessment and testing from a health professional.'],source:'World Health Organization · Malaria fact sheet',url:'https://www.who.int/news-room/fact-sheets/detail/malaria'},
{id:'cholera',category:'Hygiene',title:'Safe water and handwashing matter',summary:'Everyday hygiene helps reduce cholera risk.',body:['Use safe drinking water and practise good sanitation.','Wash hands regularly with soap and safe water, especially before handling food and after using the toilet.','Severe watery diarrhoea needs prompt medical care.'],source:'World Health Organization · Cholera fact sheet',url:'https://www.who.int/news-room/fact-sheets/detail/cholera'},
{id:'heart',category:'Wellness',title:'Know your blood pressure',summary:'Checking blood pressure helps you understand your health.',body:['High blood pressure may have no symptoms. A measurement by a trained professional is the way to know your reading.','Ask a clinician what your reading means for you.'],source:'World Health Organization · Hypertension fact sheet',url:'https://www.who.int/news-room/fact-sheets/detail/hypertension'}];
let tab='home',filter='All',query='',detail=null;let saved=new Set(JSON.parse(localStorage.getItem('pulsealert-saved')||'[]'));let state=localStorage.getItem('pulsealert-state')||'Kano';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(a){return `<article class="panel"><div class="tag">${esc(a.category.toUpperCase())} · HEALTH GUIDE</div><div class="card-title">${esc(a.title)}</div><p class="card-copy muted">${esc(a.summary)}</p><div class="actions"><button class="primary" data-open="${a.id}">Read guide</button><button class="save" data-save="${a.id}" aria-label="${saved.has(a.id)?'Remove saved':'Save'} ${esc(a.title)}">${saved.has(a.id)?'♥ Saved':'♡ Save'}</button></div></article>`}
function home(){return `<div class="top"><div class="brand"><div class="mark">✚</div>PulseAlert</div><h1>Health information,<br>made simple.</h1><p>Quick guidance for everyday decisions.</p></div><main class="main"><div class="callout"><strong>Alert centre is being set up.</strong><br>No live outbreak alerts are available yet. Check official health authorities for current notices.</div><div class="section"><h2>Today’s focus</h2><span class="pill">HEALTH GUIDE</span></div>${card(articles[0])}<div class="section"><h2>Explore more</h2><button class="secondary" data-tab="learn">See all</button></div>${articles.slice(1).map(card).join('')}<p class="muted">Educational information only. For urgent symptoms, seek local medical care.</p></main>`}
function learn(){let items=articles.filter(a=>(filter==='All'||a.category===filter)&&(`${a.title} ${a.summary}`.toLowerCase().includes(query.toLowerCase())));return `<div class="top"><div class="brand"><div class="mark">✚</div>PulseAlert</div><h1>Learn</h1><p>Clear answers, practical steps.</p></div><main class="main"><input class="search" id="search" placeholder="Search health topics" value="${esc(query)}" aria-label="Search health topics"><div class="filters">${['All','Prevention','Hygiene','Wellness'].map(x=>`<button class="filter ${filter===x?'active':''}" data-filter="${x}">${x}</button>`).join('')}</div><div id="results">${items.length?items.map(card).join(''):'<div class="empty">No guides found. Try another search.</div>'}</div></main>`}
function savedPage(){let items=articles.filter(a=>saved.has(a.id));return `<div class="top"><div class="brand"><div class="mark">✚</div>PulseAlert</div><h1>Saved guides</h1><p>Keep useful information close.</p></div><main class="main">${items.length?items.map(card).join(''):'<div class="empty">No saved guides yet. Tap Save on a guide to keep it here.</div>'}</main>`}
function settings(){return `<div class="top"><div class="brand"><div class="mark">✚</div>PulseAlert</div><h1>Your preferences</h1><p>Built for clear, accessible health information.</p></div><main class="main"><div class="panel setting"><div><strong>Location</strong><div class="muted">For future local alerts</div></div><select id="state" aria-label="State"><option value="Kano" ${state==='Kano'?'selected':''}>Kano</option><option value="Other" ${state==='Other'?'selected':''}>Other state</option></select></div><div class="panel"><strong>Notifications</strong><p class="muted">Live alerts and push notifications are planned. This version does not send notifications.</p></div><div class="panel"><strong>About PulseAlert</strong><p class="muted">Simple health education for Nigeria. Content should be medically reviewed before public release.</p><a href="https://instagram.com/pulsealert.ng" target="_blank" rel="noopener noreferrer">@pulsealert.ng</a></div></main>`}
function detailPage(a){return `<div class="detail" role="dialog" aria-modal="true" aria-label="${esc(a.title)}"><button class="back" data-close>← Back</button><p class="tag">${esc(a.category.toUpperCase())} · HEALTH GUIDE</p><h1>${esc(a.title)}</h1><p class="muted">${esc(a.summary)}</p><div class="panel"><h3>What to know</h3><ul>${a.body.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="panel source"><strong>Source</strong><p>${esc(a.source)}</p><a href="${a.url}" target="_blank" rel="noopener noreferrer">Read the source ↗</a></div><p class="muted">This guide is general education, not a diagnosis. Seek a qualified health professional for personal advice.</p><button class="secondary" data-save="${a.id}">${saved.has(a.id)?'♥ Saved':'♡ Save guide'}</button></div>`}
function render(){document.getElementById('app').innerHTML=(tab==='home'?home():tab==='learn'?learn():tab==='saved'?savedPage():settings())+`<nav class="nav" aria-label="Main navigation">${[['home','⌂','Home'],['learn','▦','Learn'],['saved','♡','Saved'],['settings','⚙','Profile']].map(([id,icon,label])=>`<button data-tab="${id}" class="${tab===id?'active':''}" aria-current="${tab===id?'page':'false'}"><span>${icon}</span>${label}</button>`).join('')}</nav>`+(detail?detailPage(articles.find(a=>a.id===detail)):'');if(detail)document.querySelector('.back').focus()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-tab],[data-open],[data-save],[data-filter],[data-close]');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;query='';detail=null;render();scrollTo(0,0)}else if(b.dataset.open){detail=b.dataset.open;render()}else if(b.dataset.close!==undefined){detail=null;render()}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.save){saved.has(b.dataset.save)?saved.delete(b.dataset.save):saved.add(b.dataset.save);localStorage.setItem('pulsealert-saved',JSON.stringify([...saved]));render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let items=articles.filter(a=>(filter==='All'||a.category===filter)&&(`${a.title} ${a.summary}`.toLowerCase().includes(query.toLowerCase())));document.getElementById('results').innerHTML=items.length?items.map(card).join(''):'<div class="empty">No guides found. Try another search.</div>'}});document.addEventListener('change',e=>{if(e.target.id==='state'){state=e.target.value;localStorage.setItem('pulsealert-state',state)}});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
